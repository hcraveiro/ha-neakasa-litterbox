name: Publish beta release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version (must match integration manifest)'
        required: true
        default: '1.5.0b1'

permissions:
  contents: write

jobs:
  publish-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate version and prepare archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          manifest = json.loads(
              Path("custom_components/neakasa_litterbox/manifest.json").read_text()
          )
          assert version == manifest["version"], (
              f"Requested {version} but manifest declares {manifest['version']}"
          )
          assert "b" in version and version.rsplit("b", 1)[1].isdigit(), (
              "This workflow only publishes beta versions."
          )
          PY
          cd custom_components/neakasa_litterbox
          zip -r ../../neakasa_litterbox.zip .
          cd ../..
          unzip -l neakasa_litterbox.zip | head -n 20

      - name: Publish prerelease with HACS archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" neakasa_litterbox.zip \
            --target "${GITHUB_SHA}" \
            --title "Neakasa Litterbox v${VERSION}" \
            --prerelease \
            --notes-file docs/beta-release-notes.md
